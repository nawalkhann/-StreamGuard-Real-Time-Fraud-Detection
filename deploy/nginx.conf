# Round-robin load balancer in front of N identical StreamGuard instances (any instance can serve any account).
events {}
http {
  upstream streamguard { server app1:8000; server app2:8000; }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    location / {
      proxy_pass http://streamguard;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;       # WebSocket (/ws/alerts)
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
  }
}
